name: Generate snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # The public streak-stats service is often overloaded (HTTP 503).
      # Retry a few times, then fall back to the previously published card
      # so the snake still gets deployed.
      - name: Download streak card
        run: |
          url="https://streak-stats.demolab.com?user=${{ github.repository_owner }}&border_radius=6.5&card_width=500&theme=nord"
          if curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors --max-time 60 "$url" -o /tmp/streak.svg \
             && grep -q "<svg" /tmp/streak.svg; then
            echo "Streak card downloaded."
          else
            echo "::warning::Streak stats service unavailable, keeping the previous card."
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/streak.svg" -o /tmp/streak.svg || rm -f /tmp/streak.svg
          fi
          if [ -s /tmp/streak.svg ]; then sudo cp /tmp/streak.svg dist/streak.svg; fi

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
